<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Voice Bot Bug Finder workflow diagram</title>
  <desc id="desc">Diagram showing outbound call testing with Twilio, realtime AI bridge, transcript analysis, and bug report generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#edf8f3"/>
    </linearGradient>
    <linearGradient id="callCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeede"/>
      <stop offset="100%" stop-color="#ffd5bc"/>
    </linearGradient>
    <linearGradient id="twilioCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7ee"/>
      <stop offset="100%" stop-color="#ffc3d2"/>
    </linearGradient>
    <linearGradient id="rtCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f2ff"/>
      <stop offset="100%" stop-color="#c5ddff"/>
    </linearGradient>
    <linearGradient id="analysisCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf8f1"/>
      <stop offset="100%" stop-color="#c8eddc"/>
    </linearGradient>
    <linearGradient id="reportCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9e7"/>
      <stop offset="100%" stop-color="#ffe8ae"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#153943" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#123b45"/>
    </marker>
    <style>
      .title { font: 700 40px 'Avenir Next', 'Segoe UI', sans-serif; fill: #10252c; }
      .subtitle { font: 600 20px 'Avenir Next', 'Segoe UI', sans-serif; fill: #315962; letter-spacing: 0.3px; }
      .step { font: 800 24px 'Avenir Next', 'Segoe UI', sans-serif; fill: #123b45; }
      .body { font: 600 17px 'Avenir Next', 'Segoe UI', sans-serif; fill: #345961; }
      .mini { font: 700 15px 'Avenir Next', 'Segoe UI', sans-serif; fill: #45656d; }
      .tag { font: 800 14px 'Avenir Next', 'Segoe UI', sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .dot { fill: #1b7463; }
      .warn { fill: #d75f39; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="166" cy="132" r="100" fill="#ffd7c7" opacity="0.42"/>
  <circle cx="1418" cy="778" r="130" fill="#ddf4ea" opacity="0.55"/>
  <circle cx="1092" cy="124" r="72" fill="#d8e8ff" opacity="0.52"/>

  <text x="100" y="112" class="title">Voice Bot Bug Finder</text>
  <text x="100" y="154" class="subtitle">Twilio call tests, realtime AI bridge, transcript scoring, and bug report generation</text>

  <g filter="url(#shadow)">
    <rect x="80" y="250" width="250" height="250" rx="28" fill="url(#callCard)"/>
    <rect x="110" y="282" width="190" height="52" rx="16" fill="#ff8d60"/>
    <text x="205" y="315" text-anchor="middle" class="tag">TEST SCENARIOS</text>
    <rect x="120" y="355" width="170" height="26" rx="10" fill="#ffffff"/>
    <text x="132" y="374" class="mini">Medication refill</text>
    <rect x="120" y="390" width="170" height="26" rx="10" fill="#ffffff"/>
    <text x="132" y="409" class="mini">Hindi only caller</text>
    <rect x="120" y="425" width="170" height="26" rx="10" fill="#ffffff"/>
    <text x="132" y="444" class="mini">Weekend booking bug</text>
    <text x="205" y="480" text-anchor="middle" class="step">Synthetic Calls</text>
  </g>

  <path d="M348 374 H432" fill="none" stroke="#123b45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="450" y="250" width="250" height="250" rx="28" fill="url(#twilioCard)"/>
    <rect x="480" y="282" width="190" height="52" rx="16" fill="#e53f6d"/>
    <text x="575" y="315" text-anchor="middle" class="tag">TWILIO PSTN</text>
    <circle cx="575" cy="398" r="58" fill="#ffffff" opacity="0.93"/>
    <path d="M544 396 C549 381, 563 374, 578 379 C592 385, 600 401, 595 417 C590 432, 574 440, 559 435 C546 430, 539 414, 544 396" fill="none" stroke="#cc2e5d" stroke-width="8" stroke-linecap="round"/>
    <path d="M559 400 L569 410 L588 391" fill="none" stroke="#cc2e5d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="575" y="478" text-anchor="middle" class="step">Call Bridge</text>
  </g>

  <path d="M718 374 H802" fill="none" stroke="#123b45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="820" y="250" width="300" height="250" rx="28" fill="url(#rtCard)"/>
    <rect x="850" y="282" width="240" height="52" rx="16" fill="#2f77d4"/>
    <text x="970" y="315" text-anchor="middle" class="tag">AZURE REALTIME</text>
    <rect x="880" y="360" width="180" height="98" rx="14" fill="#ffffff" opacity="0.93"/>
    <line x1="904" y1="389" x2="1035" y2="389" stroke="#3f7fd4" stroke-width="6" stroke-linecap="round"/>
    <line x1="904" y1="414" x2="1035" y2="414" stroke="#3f7fd4" stroke-width="6" stroke-linecap="round"/>
    <line x1="904" y1="439" x2="1006" y2="439" stroke="#3f7fd4" stroke-width="6" stroke-linecap="round"/>
    <text x="970" y="478" text-anchor="middle" class="step">Live Transcript</text>
  </g>

  <path d="M1138 374 H1222" fill="none" stroke="#123b45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1240" y="250" width="280" height="250" rx="28" fill="url(#analysisCard)"/>
    <rect x="1270" y="282" width="220" height="52" rx="16" fill="#1f8f61"/>
    <text x="1380" y="315" text-anchor="middle" class="tag">GPT-5 ANALYSIS</text>
    <rect x="1295" y="360" width="170" height="110" rx="16" fill="#ffffff" opacity="0.94"/>
    <circle cx="1325" cy="388" r="8" class="dot"/>
    <text x="1345" y="394" class="mini">Policy checks</text>
    <circle cx="1325" cy="418" r="8" class="warn"/>
    <text x="1345" y="424" class="mini">Handling failures</text>
    <circle cx="1325" cy="448" r="8" class="dot"/>
    <text x="1345" y="454" class="mini">Severity tagging</text>
    <text x="1380" y="478" text-anchor="middle" class="step">Bug Scoring</text>
  </g>

  <path d="M970 514 V606" fill="none" stroke="#123b45" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="780" y="628" width="380" height="160" rx="24" fill="url(#reportCard)" stroke="#e7d28b" stroke-width="3"/>
    <path d="M835 670 H950" fill="none" stroke="#8e7440" stroke-width="7" stroke-linecap="round"/>
    <path d="M835 700 H1030" fill="none" stroke="#8e7440" stroke-width="7" stroke-linecap="round"/>
    <path d="M835 730 H995" fill="none" stroke="#8e7440" stroke-width="7" stroke-linecap="round"/>
    <rect x="1065" y="664" width="56" height="74" rx="12" fill="#fff4cc" stroke="#d9bb62" stroke-width="3"/>
    <text x="970" y="690" text-anchor="middle" class="step">bug_report.md</text>
    <text x="970" y="723" text-anchor="middle" class="body">Critical and high-priority defects</text>
    <text x="970" y="752" text-anchor="middle" class="body">ready for triage and retest</text>
  </g>

  <text x="370" y="353" class="mini">dial</text>
  <text x="740" y="353" class="mini">stream</text>
  <text x="1160" y="353" class="mini">evaluate</text>
  <text x="988" y="592" class="mini">write report</text>
</svg>
