<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica,Arial,sans-serif">
  <rect width="640" height="360" fill="#1b2431"/>
  <text x="32" y="48" fill="#e8edf4" font-size="24" font-weight="bold">Dollars per RVU, by payer</text>
  <text x="32" y="74" fill="#9fb0c3" font-size="14">one hospital's published rates, as multiples of Medicare</text>
  <g font-size="14">
    <text x="32" y="122" fill="#e8edf4">United</text><rect x="120" y="106" width="426" height="24" rx="4" fill="#5aa9e6"/><text x="554" y="122" fill="#e8edf4">4.26x</text>
    <text x="32" y="162" fill="#e8edf4">Cigna</text><rect x="120" y="146" width="389" height="24" rx="4" fill="#5aa9e6"/><text x="517" y="162" fill="#e8edf4">3.89x</text>
    <text x="32" y="202" fill="#e8edf4">Aetna</text><rect x="120" y="186" width="363" height="24" rx="4" fill="#5aa9e6"/><text x="491" y="202" fill="#e8edf4">3.63x</text>
    <text x="32" y="242" fill="#e8edf4">BCBS</text><rect x="120" y="226" width="314" height="24" rx="4" fill="#5aa9e6"/><text x="442" y="242" fill="#e8edf4">3.14x</text>
    <text x="32" y="282" fill="#e8edf4">Ambetter</text><rect x="120" y="266" width="192" height="24" rx="4" fill="#7fd1ae"/><text x="320" y="282" fill="#e8edf4">1.92x</text>
  </g>
  <line x1="120" y1="300" x2="220" y2="300" stroke="#9fb0c3" stroke-dasharray="4 4"/>
  <text x="120" y="326" fill="#9fb0c3" font-size="13">1.0x = Medicare</text>
</svg>
