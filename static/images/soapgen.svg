<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SOAPgen workflow diagram</title>
  <desc id="desc">Workflow showing audio files sent to Azure Speech, then to OpenAI GPT 4.1, then exported to DOCX, with transcript saving and drive file movement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="audioCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0e8"/>
      <stop offset="100%" stop-color="#ffd7c7"/>
    </linearGradient>
    <linearGradient id="azureCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f1ff"/>
      <stop offset="100%" stop-color="#bfdeff"/>
    </linearGradient>
    <linearGradient id="gptCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf8f1"/>
      <stop offset="100%" stop-color="#c8eedc"/>
    </linearGradient>
    <linearGradient id="docxCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="100%" stop-color="#ffe7a8"/>
    </linearGradient>
    <linearGradient id="sideCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f8f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#143942" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#123b45"/>
    </marker>
    <style>
      .title { font: 700 40px 'Avenir Next', 'Segoe UI', sans-serif; fill: #10252c; }
      .subtitle { font: 600 20px 'Avenir Next', 'Segoe UI', sans-serif; fill: #315962; letter-spacing: 0.3px; }
      .step { font: 800 24px 'Avenir Next', 'Segoe UI', sans-serif; fill: #123b45; }
      .body { font: 600 17px 'Avenir Next', 'Segoe UI', sans-serif; fill: #345961; }
      .mini { font: 700 15px 'Avenir Next', 'Segoe UI', sans-serif; fill: #45656d; }
      .tag { font: 800 14px 'Avenir Next', 'Segoe UI', sans-serif; fill: #ffffff; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="168" cy="130" r="100" fill="#ffd7c7" opacity="0.4"/>
  <circle cx="1420" cy="780" r="130" fill="#dff5ee" opacity="0.55"/>
  <circle cx="1090" cy="120" r="72" fill="#d8e9ff" opacity="0.5"/>

  <text x="100" y="112" class="title">SOAPgen Workflow</text>
  <text x="100" y="154" class="subtitle">Audio file to Azure Speech, GPT-4.1, DOCX, transcript saving, and drive organization</text>

  <g filter="url(#shadow)">
    <rect x="90" y="250" width="280" height="250" rx="28" fill="url(#audioCard)"/>
    <rect x="115" y="275" width="86" height="112" rx="14" fill="#ffffff" stroke="#ff9a76" stroke-width="4"/>
    <line x1="132" y1="312" x2="183" y2="312" stroke="#ff9a76" stroke-width="4" stroke-linecap="round"/>
    <line x1="132" y1="337" x2="183" y2="337" stroke="#ff9a76" stroke-width="4" stroke-linecap="round"/>
    <line x1="132" y1="362" x2="169" y2="362" stroke="#ff9a76" stroke-width="4" stroke-linecap="round"/>
    <circle cx="278" cy="330" r="52" fill="#103842"/>
    <rect x="266" y="386" width="24" height="56" rx="12" fill="#103842"/>
    <path d="M226 331 C242 314, 242 346, 226 329" fill="none" stroke="#ff7d57" stroke-width="10" stroke-linecap="round"/>
    <path d="M330 331 C314 314, 314 346, 330 329" fill="none" stroke="#ff7d57" stroke-width="10" stroke-linecap="round"/>
    <text x="230" y="450" text-anchor="middle" class="step">Audio File</text>
    <text x="230" y="480" text-anchor="middle" class="body">Clinical recording</text>
  </g>

  <path d="M388 374 H482" fill="none" stroke="#123b45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="500" y="250" width="280" height="250" rx="28" fill="url(#azureCard)"/>
    <rect x="530" y="280" width="220" height="54" rx="18" fill="#1274d8"/>
    <text x="640" y="315" text-anchor="middle" class="tag">AZURE SPEECH</text>
    <path d="M591 386 C591 353, 689 353, 689 386 C714 389, 730 406, 730 430 C730 457, 710 476, 683 476 H596 C567 476, 545 457, 545 430 C545 407, 560 390, 584 386 C587 366, 603 351, 623 351 C638 351, 652 360, 659 374 C668 367, 678 364, 690 366" fill="#ffffff" opacity="0.95"/>
    <path d="M632 410 C638 400, 651 397, 660 404 C670 412, 670 426, 660 434 C653 440, 643 442, 632 442" fill="none" stroke="#1274d8" stroke-width="7" stroke-linecap="round"/>
    <path d="M613 402 C623 420, 623 420, 613 438" fill="none" stroke="#1274d8" stroke-width="7" stroke-linecap="round"/>
    <text x="640" y="450" text-anchor="middle" class="step">Speech To Text</text>
    <text x="640" y="480" text-anchor="middle" class="body">Transcription output</text>
  </g>

  <path d="M798 374 H892" fill="none" stroke="#123b45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="910" y="250" width="280" height="250" rx="28" fill="url(#gptCard)"/>
    <rect x="940" y="280" width="220" height="54" rx="18" fill="#1f8f61"/>
    <text x="1050" y="315" text-anchor="middle" class="tag">OPENAI GPT-4.1</text>
    <circle cx="1050" cy="405" r="64" fill="#ffffff" opacity="0.92"/>
    <path d="M1014 392 C1024 372, 1046 365, 1065 374 C1084 383, 1090 406, 1080 425 C1070 444, 1048 450, 1029 441 C1010 432, 1004 410, 1014 392" fill="none" stroke="#1f8f61" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1027 391 C1041 404, 1059 405, 1073 391" fill="none" stroke="#1f8f61" stroke-width="7" stroke-linecap="round"/>
    <path d="M1029 421 C1045 433, 1056 433, 1071 421" fill="none" stroke="#1f8f61" stroke-width="7" stroke-linecap="round"/>
    <text x="1050" y="450" text-anchor="middle" class="step">SOAP Drafting</text>
    <text x="1050" y="480" text-anchor="middle" class="body">Structured note generation</text>
  </g>

  <path d="M1208 374 H1302" fill="none" stroke="#123b45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1320" y="250" width="200" height="250" rx="28" fill="url(#docxCard)"/>
    <path d="M1370 292 H1454 L1480 318 V456 H1370 Z" fill="#ffffff" stroke="#e2b847" stroke-width="4"/>
    <path d="M1454 292 V318 H1480" fill="#fff0b5" stroke="#e2b847" stroke-width="4"/>
    <text x="1425" y="370" text-anchor="middle" class="step">DOCX</text>
    <text x="1425" y="400" text-anchor="middle" class="body">Final note</text>
    <text x="1425" y="430" text-anchor="middle" class="body">exported</text>
  </g>

  <path d="M640 514 V608" fill="none" stroke="#123b45" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1425 514 V608" fill="none" stroke="#123b45" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="470" y="630" width="340" height="150" rx="24" fill="url(#sideCard)" stroke="#d8e7e2" stroke-width="3"/>
    <rect x="500" y="660" width="70" height="88" rx="12" fill="#e8f2ff" stroke="#8ab8f5" stroke-width="3"/>
    <line x1="515" y1="688" x2="555" y2="688" stroke="#4d86d8" stroke-width="4" stroke-linecap="round"/>
    <line x1="515" y1="710" x2="555" y2="710" stroke="#4d86d8" stroke-width="4" stroke-linecap="round"/>
    <line x1="515" y1="732" x2="545" y2="732" stroke="#4d86d8" stroke-width="4" stroke-linecap="round"/>
    <text x="680" y="692" text-anchor="middle" class="step">Transcript Saved</text>
    <text x="680" y="724" text-anchor="middle" class="body">Keep raw text</text>
    <text x="680" y="750" text-anchor="middle" class="body">for review and audit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1235" y="630" width="380" height="150" rx="24" fill="url(#sideCard)" stroke="#d8e7e2" stroke-width="3"/>
    <path d="M1270 725 H1375" fill="none" stroke="#5b7c85" stroke-width="7" stroke-linecap="round"/>
    <path d="M1270 690 H1398" fill="none" stroke="#5b7c85" stroke-width="7" stroke-linecap="round"/>
    <path d="M1270 690 V748 C1270 758, 1278 766, 1288 766 H1415 C1425 766, 1433 758, 1433 748 V700" fill="none" stroke="#5b7c85" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1448 688 H1570" fill="none" stroke="#123b45" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="1510" y="660" width="70" height="78" rx="14" fill="#d8f0e8" stroke="#71b59a" stroke-width="3"/>
    <path d="M1524 685 H1566" fill="none" stroke="#4d8f77" stroke-width="4" stroke-linecap="round"/>
    <path d="M1524 705 H1560" fill="none" stroke="#4d8f77" stroke-width="4" stroke-linecap="round"/>
    <text x="1415" y="692" text-anchor="middle" class="step">Files Moved</text>
    <text x="1415" y="724" text-anchor="middle" class="body">Archive outputs</text>
    <text x="1415" y="750" text-anchor="middle" class="body">into drive folders</text>
  </g>

  <text x="435" y="353" class="mini">upload</text>
  <text x="844" y="353" class="mini">prompt</text>
  <text x="1254" y="353" class="mini">export</text>
</svg>