<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Request latency: Go 0.41 ms versus Python 1.61 ms, about 4 times faster">
  <rect width="800" height="420" rx="18" fill="#10151c"/>
  <text x="40" y="64" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#e8edf4">Request latency</text>
  <text x="40" y="94" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#9aa7b8">same endpoint, same laptop · /glossary/wicket · 50 requests · July 2026</text>

  <text x="760" y="70" text-anchor="end" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="700" fill="#e8edf4">≈4×</text>
  <text x="760" y="94" text-anchor="end" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" fill="#9aa7b8">faster in Go</text>

  <!-- Python bar: full scale -->
  <text x="40" y="160" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#e8edf4">Python · FastAPI + uvicorn</text>
  <path d="M40 172 h676 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-676 z" fill="#6b87e0"/>
  <text x="728" y="193" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" fill="#e8edf4">1.61 ms</text>

  <!-- Go bar: 0.41/1.61 of the scale -->
  <text x="40" y="252" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#e8edf4">Go · standard library</text>
  <path d="M40 264 h169 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-169 z" fill="#37a862"/>
  <text x="223" y="285" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" fill="#e8edf4">0.41 ms</text>

  <!-- legend -->
  <circle cx="46" cy="336" r="6" fill="#6b87e0"/>
  <text x="60" y="341" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#9aa7b8">Python 3.11</text>
  <circle cx="176" cy="336" r="6" fill="#37a862"/>
  <text x="190" y="341" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#9aa7b8">Go 1.20</text>

  <text x="40" y="388" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#9aa7b8">Same machine, same JSON endpoint, warmed. Boot to serving: 1.90 s vs 1.14 s.</text>
</svg>
