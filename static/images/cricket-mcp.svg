  <path d="M116 118 q-21 62 0 124" stroke="#f8e7c9" stroke-width="6" fill="none"/>
  <path d="M184 118 q21 62 0 124" stroke="#f8e7c9" stroke-width="6" fill="none"/>
  <path d="M122 131 l11 6 M119 154 l11 5 M118 177 l11 2 M119 200 l11 -2 M123 223 l11 -5" stroke="#f8e7c9" stroke-width="3"/>
  <path d="M178 131 l-11 6 M181 154 l-11 5 M182 177 l-11 2 M181 200 l-11 -2 M177 223 l-11 -5" stroke="#f8e7c9" stroke-width="3"/>
  <!-- stdio pipe: server -> client -->
  <path d="M228 180 h64" stroke="#2a3547" stroke-width="4"/>
  <path d="M292 180 l-12 -7 v14z" fill="#2a3547"/>
