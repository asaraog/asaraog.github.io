  <text x="336" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#9aa7b8">tools/list</text>
  <text x="336" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#e8edf4">cricket_win_probability</text>
  <text x="336" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#e8edf4">cricket_head_to_head</text>
  <text x="336" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#e8edf4">cricket_match_archive</text>
  <text x="336" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#9aa7b8">+ 8 more</text>
  <!-- title -->
  <text x="400" y="348" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="700" fill="#4fc37f">Cricket MCP Server</text>
  <text x="400" y="388" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" fill="#9aa7b8">a fitted win model and a 22,479-match archive, for any MCP client</text>
